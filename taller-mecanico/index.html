<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taller Mecánico</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <h1>🔧 Taller Mecánico</h1>
    <p>Registro de vehículos, fallas y mano de obra</p>
  </header>

  <main class="contenedor">
    <section class="tarjeta">
      <h2>Nuevo registro</h2>
      <form id="formulario" class="formulario">
        <div class="campo"><label for="cliente">Cliente</label>
          <input id="cliente" required></div>
        <div class="campo"><label for="vehiculo">Vehículo (marca, modelo, año)</label>
          <input id="vehiculo" required></div>
        <div class="campo"><label for="placas">Placas</label>
          <input id="placas" required></div>
        <div class="campo ancho"><label for="falla">Falla reportada</label>
          <textarea id="falla" rows="2" required></textarea></div>

        <div class="campo ancho">
          <label>Mano de obra</label>
          <div id="trabajos"></div>
          <button type="button" id="agregarTrabajo" class="btn secundario">+ Agregar trabajo</button>
        </div>

        <div class="campo"><label for="refacciones">Refacciones ($)</label>
          <input id="refacciones" type="number" min="0" step="0.01" value="0"></div>
        <div class="total">Total: <strong id="total">$0.00</strong></div>
        <button type="submit" class="btn">Guardar registro</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Vehículos registrados</h2>
      <div id="lista" class="lista"></div>
    </section>
  </main>

  <script src="js/calculos.js"></script>
  <script src="js/almacenamiento.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
